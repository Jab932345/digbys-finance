  const add = (name, desc, cols, rows) => files.push({ name, desc, rows: rows.length, csv: toCSV(cols, rows) });
  const staffById = {}; (S.staff || []).forEach(s => staffById[s.id] = s);

  const gl = E.ledger(S, { from: per.from, to: per.to });
  add('general_ledger.csv', 'Every double-entry posting: one row per debit or credit', [
    { h: 'date', v: 'date' }, { h: 'transaction_id', v: 'txnId' }, { h: 'type', v: 'type' }, { h: 'reference', v: 'ref' },
    { h: 'contact', v: r => contactName(r.contactId) }, { h: 'description', v: 'desc' },
    { h: 'account_code', v: 'account' }, { h: 'account_name', v: r => acctName(r.account) }, { h: 'account_type', v: r => (acc[r.account] || {}).type || '' },
    { h: 'debit', v: r => dec(r.debit) }, { h: 'credit', v: r => dec(r.credit) },
    { h: 'vat_code', v: r => r.vatCode || '' }, { h: 'line_net', v: r => r.vatCode ? dec(r.net) : '' }, { h: 'line_vat', v: r => r.vatCode ? dec(r.vat) : '' },
    { h: 'division', v: r => r.division || '' }, { h: 'job_code', v: r => r.jobCode || '' },
    { h: 'bank_line_id', v: r => (txById[r.txnId] || {}).bankLineId || '' }, { h: 'created_by', v: r => (txById[r.txnId] || {}).createdBy || '' },
    { h: 'created_at', v: r => (txById[r.txnId] || {}).createdAt || '' }, { h: 'updated_at', v: r => (txById[r.txnId] || {}).updatedAt || '' }
  ], gl);

  const lineRows = [];
  (S.txns || []).filter(t => E.inRange(t.date, per.from, per.to) && !['journal', 'payroll', 'customer_payment', 'supplier_payment', 'transfer'].includes(t.type)).forEach(t => {

  add('transactions.csv', 'Invoices, bills, credits and coded bank items at line level with VAT', [
    { h: 'date', v: r => r.t.date }, { h: 'due_date', v: r => r.t.dueDate || '' }, { h: 'type', v: r => r.t.type }, { h: 'status', v: r => r.t.status || 'approved' },
    { h: 'reference', v: r => r.t.ref || '' }, { h: 'contact', v: r => contactName(r.t.contactId) }, { h: 'description', v: r => r.t.description || '' },
    { h: 'line', v: r => r.i + 1 }, { h: 'line_description', v: r => r.l.description || '' }, { h: 'account_code', v: r => r.l.account }, { h: 'account_name', v: r => acctName(r.l.account) },
    { h: 'quantity', v: r => r.l.qty == null ? '' : r.l.qty }, { h: 'unit_price', v: r => r.l.unitPrice == null ? '' : (+r.l.unitPrice).toFixed(2) },
    { h: 'net', v: r => dec(E.P(r.l.net)) }, { h: 'vat_code', v: r => r.l.vatCode || '' }, { h: 'vat_rate', v: r => ((E.VAT_CODES[r.l.vatCode] || {}).rate || 0) * 100 },
    { h: 'vat', v: r => dec(E.P(r.l.vat)) }, { h: 'gross', v: r => dec(E.P(r.l.net) + E.P(r.l.vat)) },
    { h: 'division', v: r => r.l.division || r.t.division || '' }, { h: 'job_code', v: r => r.l.jobCode || r.t.jobCode || '' },
    { h: 'document_outstanding', v: r => r.st && r.i === 0 ? dec(r.st.due) : '' }, { h: 'transaction_id', v: r => r.t.id }
  ], lineRows);

  const tb = E.trialBalance(S, { to: at });
  add('trial_balance.csv', `Trial balance at ${at}`, [{ h: 'account_code', v: 'code' }, { h: 'account_name', v: 'name' }, { h: 'account_type', v: 'type' }, { h: 'debit', v: r => dec(r.debit) }, { h: 'credit', v: r => dec(r.credit) }],
    tb.rows.concat([{ code: '', name: 'TOTAL', type: '', debit: tb.totals.debit, credit: tb.totals.credit }]));

  const p = E.pnl(S, per); const pcols = E.DIV_IDS.concat(['none']);
  const prow = (label, o, code) => Object.assign({ code: code || '', label }, ...pcols.map(c => ({ [c]: dec(o.cols[c] || 0) })), { total: dec(o.total) });
  const prows = [].concat(p.income.map(l => prow(l.name, l, l.code)), [prow('Total turnover', p.totals.income)], p.cos.map(l => prow(l.name, l, l.code)), [prow('Total cost of sales', p.totals.cos), prow('Gross profit', p.totals.grossProfit)], p.overheads.map(l => prow(l.name, l, l.code)), [prow('Total overheads', p.totals.overheads), prow('Net profit before tax', p.totals.netProfit)]);
  add('profit_and_loss.csv', 'Profit and loss with a column per division', [{ h: 'account_code', v: 'code' }, { h: 'line', v: 'label' }].concat(pcols.map(c => ({ h: c === 'none' ? 'unallocated' : c, v: c }))).concat([{ h: 'total', v: 'total' }]), prows);

  const b = E.balanceSheet(S, { at });
  const brows = [].concat(b.fixed.map(r => ['Fixed assets', r]), b.current.map(r => ['Current assets', r]), b.liabilities.map(r => ['Creditors within one year', r]), b.equity.map(r => ['Capital and reserves', r]), [['Capital and reserves', { code: '', name: 'Profit and loss account', amount: b.profitToDate }]]);
  add('balance_sheet.csv', `Balance sheet at ${at}`, [{ h: 'section', v: r => r[0] }, { h: 'account_code', v: r => r[1].code }, { h: 'account_name', v: r => r[1].name }, { h: 'amount', v: r => dec(r[1].amount) }],
    brows.concat([['Net assets', { code: '', name: 'Net assets', amount: b.totals.netAssets }], ["Shareholders' funds", { code: '', name: "Shareholders' funds", amount: b.totals.equity }]]));

  if (S.company.vatRegistered) {
    const periods = E.vatPeriods(S.company, at).filter(x => x.to >= per.from && x.from <= per.to);
    add('vat_returns.csv', 'Nine-box VAT returns for each period in range', [{ h: 'period_from', v: 'from' }, { h: 'period_to', v: 'to' }, { h: 'due', v: 'due' }, { h: 'status', v: 'status' }].concat([1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => ({ h: 'box_' + n, v: r => dec(r.boxes[n]) }))).concat([{ h: 'filed_at', v: 'filedAt' }, { h: 'receipt', v: 'receipt' }, { h: 'scheme', v: () => S.company.vatScheme || 'standard' }]),
      periods.map(x => { const f = (S.vatReturns || []).find(r => r.from === x.from && r.status === 'filed'); const r = E.vatReturn(S, x); return Object.assign({}, x, { boxes: f ? f.boxes : r.boxes, status: f ? 'filed' : (x.to < today() ? 'ready' : 'open'), filedAt: f ? f.filedAt : '', receipt: f ? f.receipt : '' }); }));
    const ve = E.vatEntries(S).filter(e => E.inRange(e.date, per.from, per.to));
    add('vat_detail.csv', 'Every VAT entry by tax point date', [{ h: 'tax_point', v: 'date' }, { h: 'side', v: 'kind' }, { h: 'reference', v: 'ref' }, { h: 'description', v: 'desc' }, { h: 'account_code', v: 'account' }, { h: 'vat_code', v: 'code' }, { h: 'net', v: r => dec(r.net) }, { h: 'vat', v: r => dec(r.vat) }, { h: 'gross', v: r => dec(r.gross) }, { h: 'division', v: r => r.division || '' }, { h: 'transaction_id', v: 'txnId' }], ve);
  }

  ['debtors', 'creditors'].forEach(kind => {
    const a = E.aged(S, { at, kind }); const rows = []; a.rows.forEach(r => r.docs.forEach(d => rows.push(Object.assign({ contact: contactName(r.contactId) }, d))));
    add(`aged_${kind}.csv`, `Outstanding ${kind === 'debtors' ? 'sales invoices' : 'bills'} at ${at}`, [{ h: 'contact', v: 'contact' }, { h: 'reference', v: 'ref' }, { h: 'date', v: 'date' }, { h: 'due_date', v: 'dueDate' }, { h: 'bucket', v: 'bucket' }, { h: 'outstanding', v: r => dec(r.due) }], rows);
  });

  const docCols = [{ h: 'reference', v: r => r.ref || '' }, { h: 'type', v: 'type' }, { h: 'status', v: r => E.docStatus(S, r, at).label }, { h: 'date', v: 'date' }, { h: 'due_date', v: r => r.dueDate || '' }, { h: 'contact', v: r => contactName(r.contactId) }, { h: 'division', v: r => r.division || '' }, { h: 'job_code', v: r => r.jobCode || '' }, { h: 'net', v: r => dec(E.lineTotals(r.lines).net) }, { h: 'vat', v: r => dec(E.lineTotals(r.lines).vat) }, { h: 'gross', v: r => dec(E.lineTotals(r.lines).gross) }, { h: 'paid', v: r => dec(E.allocatedTo(S, r.id)) }, { h: 'outstanding', v: r => dec(E.docStatus(S, r, at).due) }];
  add('sales_invoices.csv', 'Sales invoices and credit notes', docCols, (S.txns || []).filter(t => ['invoice', 'credit_note'].includes(t.type) && E.inRange(t.date, per.from, per.to)));
  add('bills.csv', 'Supplier bills and credits', docCols, (S.txns || []).filter(t => ['bill', 'supplier_credit'].includes(t.type) && E.inRange(t.date, per.from, per.to)));

  add('bank_feed.csv', 'Starling feed lines and how each was posted', [{ h: 'date', v: 'date' }, { h: 'counterparty', v: 'counterparty' }, { h: 'reference', v: 'reference' }, { h: 'amount', v: r => (+r.amount).toFixed(2) }, { h: 'status', v: 'status' }, { h: 'transaction_id', v: r => r.txnId || '' }, { h: 'bank_line_id', v: 'id' }], (S.bankLines || []).filter(bl => E.inRange(bl.date, per.from, per.to)).sort((x, y) => x.date.localeCompare(y.date)));

  add('chart_of_accounts.csv', 'Nominal codes in use', [{ h: 'account_code', v: 'code' }, { h: 'account_name', v: 'name' }, { h: 'account_type', v: 'type' }, { h: 'default_vat_code', v: 'vatDefault' }, { h: 'archived', v: r => r.archived ? 'yes' : 'no' }], S.accounts || []);
  add('contacts.csv', 'Customers and suppliers', [{ h: 'id', v: 'id' }, { h: 'type', v: 'kind' }, { h: 'name', v: 'name' }, { h: 'email', v: 'email' }, { h: 'phone', v: 'phone' }, { h: 'address', v: 'address' }, { h: 'vat_number', v: r => r.vatNumber || '' }, { h: 'usual_division', v: r => r.division || '' }], S.contacts || []);
  add('fixed_assets.csv', 'Additions and disposals on the fixed asset accounts', [{ h: 'date', v: 'date' }, { h: 'description', v: 'desc' }, { h: 'account_code', v: 'account' }, { h: 'account_name', v: r => acctName(r.account) }, { h: 'cost', v: r => dec(r.debit - r.credit) }, { h: 'supplier', v: r => contactName(r.contactId) }, { h: 'division', v: r => r.division || '' }, { h: 'aia_eligible', v: r => r.account === '0020' ? 'check' : 'yes' }, { h: 'transaction_id', v: 'txnId' }], E.ledger(S, { to: at }).filter(x => ['0010', '0020', '0030'].includes(x.account)));

  const payRows = []; (S.payrollRuns || []).filter(r => E.inRange(r.payDate, per.from, per.to)).forEach(r => (r.lines || []).forEach(l => payRows.push(Object.assign({ run: r }, l))));
  add('payroll.csv', 'Pay runs per employee (input for RTI and reconciliation)', [{ h: 'pay_date', v: r => r.run.payDate }, { h: 'period_from', v: r => r.run.periodFrom }, { h: 'period_to', v: r => r.run.periodTo }, { h: 'frequency', v: r => r.run.frequency }, { h: 'status', v: r => r.run.status }, { h: 'employee', v: r => staffName(r.staffId) }, { h: 'ni_number', v: r => (staffById[r.staffId] || {}).niNumber || '' }, { h: 'tax_code', v: r => (staffById[r.staffId] || {}).taxCode || '' }, { h: 'hours', v: 'hours' }, { h: 'rate', v: r => (+r.rate || 0).toFixed(2) }, { h: 'basic', v: r => dec(E.P(r.basic)) }, { h: 'holiday_pay', v: r => dec(E.P(r.holiday)) }, { h: 'gross', v: r => dec(E.P(r.gross)) }, { h: 'paye', v: r => dec(E.P(r.paye)) }, { h: 'employee_nic', v: r => dec(E.P(r.eeNic)) }, { h: 'employer_nic', v: r => dec(E.P(r.erNic)) }, { h: 'employee_pension', v: r => dec(E.P(r.pension)) }, { h: 'employer_pension', v: r => dec(E.P(r.erPension)) }, { h: 'net_pay', v: r => dec(E.P(r.net)) }, { h: 'division', v: r => r.division || '' }], payRows);

  const mRows = []; [E.taxYearStart(per.from), E.taxYearStart(at)].filter((v, i, a) => a.indexOf(v) === i).forEach(ty => E.mileageClaims(S, ty).forEach(c => c.trips.filter(tr => E.inRange(tr.date, per.from, per.to)).forEach(tr => mRows.push(tr))));
  add('mileage.csv', 'Business journeys at HMRC approved mileage rates', [{ h: 'date', v: 'date' }, { h: 'driver', v: 'driver' }, { h: 'from', v: 'from' }, { h: 'to', v: 'to' }, { h: 'purpose', v: 'purpose' }, { h: 'miles', v: 'miles' }, { h: 'passengers', v: r => r.passengers || 0 }, { h: 'rate_band', v: 'rate' }, { h: 'claim', v: r => dec(r.claimP) }, { h: 'job_code', v: r => r.jobCode || '' }, { h: 'recorded_by', v: 'method' }, { h: 'posted_transaction', v: r => r.claimTxnId || '' }], mRows);

  const dRows = []; (S.company.directors || []).forEach(d => E.dla(S, d.dla).lines.filter(r => E.inRange(r.date, per.from, per.to)).forEach(r => dRows.push(Object.assign({ director: d.name }, r))));
  add('directors_loans.csv', "Director's loan account movements (positive balance = company owes the director)", [{ h: 'director', v: 'director' }, { h: 'date', v: 'date' }, { h: 'reference', v: 'ref' }, { h: 'description', v: 'desc' }, { h: 'owed_to_director', v: r => dec(r.credit) }, { h: 'owed_to_company', v: r => dec(r.debit) }, { h: 'balance', v: r => dec(r.balance) }], dRows);

  add('job_profitability.csv', 'Sales, direct costs and mileage per job code', [{ h: 'job_code', v: 'code' }, { h: 'name', v: 'name' }, { h: 'division', v: r => r.division || '' }, { h: 'event_date', v: r => r.eventDate || '' }, { h: 'sales', v: r => dec(jobFigures(r.code).rev) }, { h: 'direct_costs', v: r => dec(jobFigures(r.code).cost) }, { h: 'mileage_cost', v: r => dec(jobFigures(r.code).mileCost) }, { h: 'profit', v: r => dec(jobFigures(r.code).profit) }], S.jobCodes || []);

  add('audit_trail.csv', 'Who changed what and when', [{ h: 'timestamp', v: 'ts' }, { h: 'user', v: 'user' }, { h: 'action', v: 'action' }, { h: 'record_type', v: 'entity' }, { h: 'record_id', v: 'entityId' }, { h: 'summary', v: 'summary' }], (S.audit || []).filter(a => (a.ts || '').slice(0, 10) >= per.from && (a.ts || '').slice(0, 10) <= per.to));

  return files;
}

function readme(per, files) {
  const c = S.company;
  return [
    `${c.name} — accounting export`,
    `Company number ${c.companyNo || '—'} · UTR ${c.utr || '—'} · ${c.vatRegistered ? 'VAT ' + c.vatNumber + ' (' + (c.vatScheme || 'standard') + ' scheme, stagger ' + (c.vatStagger || 1) + ')' : 'Not VAT registered'}`,
    `Period ${per.from} to ${per.to} · financial year end ${c.yearEnd || '03-31'} · produced ${new Date().toISOString()} by ${store.user.email}`,
    `Period lock date: ${c.lockDate || 'none'}`, '',
    'Conventions',
    '- Accruals basis, double entry. general_ledger.csv balances: total debits equal total credits.',
    '- Dates are ISO 8601 (YYYY-MM-DD). Amounts are GBP to two decimal places, no currency symbol; credits are positive in the credit column.',
    '- Every line carries a division (events, pies, butchery, hire, or blank for central overheads) and, where relevant, a job code.',
    '- VAT codes: S20 standard 20%, R5 reduced 5%, Z0 zero-rated, EX exempt, NV no VAT charged by supplier, OS outside the scope, NR before VAT registration.',
    '- VAT boxes 6 to 9 are in whole pounds. Boxes 1 to 5 are to the penny.',
    '- transaction_id links every ledger row back to its source document and to bank_feed.csv.',
    '- Files are UTF-8 with a byte order mark so spreadsheet software reads the pound sign correctly.', '',
    'Files',
    ...files.map(f => `- ${f.name} (${f.rows} rows): ${f.desc}`),
    '- backup.json: the complete data set, for re-import or archive.'
  ].join('\r\n') + '\r\n';
}

PAGES.export = function () {
  const per = currentPeriod(); const files = exportFiles(per);
  const hc = E.healthChecks(S, today()); const bs = E.balanceSheet(S, { at: per.to < today() ? per.to : today() });
  const checks = [
    [hc.tb.balanced, 'Trial balance: debits equal credits'],
    [bs.balanced, 'Balance sheet balances'],
    [!hc.issues.some(i => /unbalanced/.test(i.text)), 'Every transaction balances on its own'],
    [!(S.bankLines || []).some(b => b.status === 'unreconciled' && b.date <= per.to), 'Bank reconciled to the end of the period'],
    [!(S.payrollRuns || []).some(r => r.status !== 'posted' && r.payDate <= per.to), 'Every pay run in the period posted'],
    [!S.company.vatRegistered || !E.vatPeriods(S.company, per.to).some(x => x.to <= per.to && x.to >= per.from && !(S.vatReturns || []).some(r => r.from === x.from && r.status === 'filed')), 'VAT returns in the period filed']
  ];
  return head('Export pack', 'One zip of CSV files your accountant can import into any software, with a README describing every file.', `<button class="btn primary" data-act="exportZip">${ico('down')} Download pack (.zip)</button>`) + `
  <div class="stack">${periodControl()}
    <section class="panel"><div class="panel-head"><h2>Checks before export</h2><span class="sub">${checks.filter(c => c[0]).length} of ${checks.length} pass</span></div><div class="list">
      ${checks.map(([ok, label]) => `<div class="list-row"><span class="pill ${ok ? 'good' : 'warn'}">${ico(ok ? 'check' : 'warn')}</span><span class="grow">${label}</span></div>`).join('')}
    </div></section>
    <section class="panel"><div class="panel-head"><h2>Files</h2><span class="sub">${files.length + 2} files · ${fdate(per.from)} – ${fdate(per.to)}</span></div><div class="table-wrap"><table class="t"><thead><tr><th>File</th><th>Contents</th><th class="num">Rows</th><th></th></tr></thead><tbody>
      <tr><td class="mono">README.txt</td><td class="wrap">Company details, conventions and file list</td><td></td><td><button class="btn sm" data-act="previewFile" data-name="README.txt">Preview</button></td></tr>
      ${files.map(f => `<tr><td class="mono">${f.name}</td><td class="wrap">${esc(f.desc)}</td><td class="num">${f.rows}</td><td><div class="head-actions"><button class="btn sm" data-act="previewFile" data-name="${f.name}">Preview</button><button class="btn sm plain" data-act="saveOne" data-name="${f.name}">${ico('down')}</button></div></td></tr>`).join('')}
      <tr><td class="mono">backup.json</td><td class="wrap">Complete data set for archive or re-import</td><td></td><td><button class="btn sm plain" data-act="saveBackup">${ico('down')}</button></td></tr>
    </tbody></table></div></section>
  </div>`;
};
ACT.previewFile = (el) => {
  const per = currentPeriod(); const files = exportFiles(per);
  const content = el.dataset.name === 'README.txt' ? readme(per, files) : (files.find(f => f.name === el.dataset.name) || {}).csv || '';
  const lines = content.replace(/^﻿/, '').split(/\r?\n/); const shown = lines.slice(0, 40).join('\n');
  openSheet({ title: el.dataset.name, size: 'wide', body: `<div class="code-view" style="max-height:60vh">${esc(shown)}${lines.length > 40 ? `\n… ${lines.length - 40} more lines` : ''}</div>`, foot: `<button class="btn primary" data-act="saveOne" data-name="${esc(el.dataset.name)}">${ico('down')} Download</button>` });
};
ACT.saveOne = async (el) => {
  const per = currentPeriod(); const files = exportFiles(per);
  if (el.dataset.name === 'README.txt') return saveFile('README.txt', readme(per, files), 'text/plain');
  const f = files.find(x => x.name === el.dataset.name); if (f) await saveFile(f.name, f.csv, 'text/csv');
};
ACT.saveBackup = () => saveFile(`digbys-backup-${today()}.json`, JSON.stringify(backupData(), null, 2), 'application/json');
function backupData() { const o = {}; ['company', 'accounts', 'contacts', 'jobCodes', 'txns', 'bankLines', 'staff', 'payrollRuns', 'mileage', 'vatReturns', 'rules'].forEach(k => o[k] = S[k]); o.exportedAt = nowIso(); o.exportedBy = store.user.email; return o; }
ACT.exportZip = async () => {
  if (!window.JSZip) throw new Error('The zip library did not load. Download the files one at a time instead.');
  const per = currentPeriod(); const files = exportFiles(per); const zip = new window.JSZip();
  const folder = `digbys-co-${per.from}-to-${per.to}`;
  zip.file(`${folder}/README.txt`, readme(per, files));
  files.forEach(f => zip.file(`${folder}/${f.name}`, f.csv));
  zip.file(`${folder}/backup.json`, JSON.stringify(backupData(), null, 2));
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  await saveFile(`${folder}.zip`, blob, 'application/zip');
};

// one-click CSVs from report pages
ACT.csv = async (el) => {
  const per = currentPeriod(); const files = exportFiles(per);

};

      <dt>Locked to</dt><dd>${c.lockDate ? fdate(c.lockDate) : 'Nothing locked'}</dd>
      <dt>Records</dt><dd>${n('txns')} transactions · ${n('bankLines')} bank lines · ${n('contacts')} contacts · ${n('staff')} staff · ${n('payrollRuns')} pay runs</dd>
      <dt>Integrity</dt><dd>${hc.tb.balanced ? '<span class="pill good">Trial balance agrees</span>' : '<span class="pill bad">Trial balance out</span>'} ${hc.issues.length ? hc.issues.map(i => `<span class="pill ${i.level === 'critical' ? 'bad' : 'warn'}">${esc(i.text)}</span>`).join(' ') : ''}</dd>
    </dl></div></section>
    <section class="panel"><div class="panel-body doc-copy" style="padding-top:18px">
      <h3>Basis and structure</h3>
      <p>Full double entry on the accruals basis. Sales invoices post to trade debtors and bills to trade creditors on their document date; payments clear them through allocations, so part payments and deposits are tracked against each invoice. Bank items with no invoice are coded straight to an account. Manual journals are available to the accountant role for year-end adjustments, accruals, prepayments and depreciation.</p>
      <p>The chart of accounts follows the familiar four-digit layout: 0xxx fixed assets, 1xxx current assets, 2xxx liabilities, 3xxx capital, 4xxx sales, 5xxx cost of sales, 7xxx–8xxx overheads. Sales have one nominal per venture (4000 events, 4010 pies, 4020 butchery, 4030 hire).</p>
      <h3>Divisions and job codes</h3>
      <p>Every line carries a division: Events, Pies, Butchery or Hire, or none for central overheads. The profit and loss runs with a column per division, so each venture can be read on its own or split into a separate company later without re-keying. Payroll journals split wage costs by each employee's division. Job codes tie an event's invoice, purchases and mileage together for per-job margin.</p>
      <h3>VAT</h3>
      <p>Each line holds a VAT code, net and VAT amount. The return is built from tax-point entries: invoice date on the standard scheme, payment date on cash accounting, and gross turnover at the flat rate (with capital goods over £2,000 reclaimed separately) on the flat rate scheme. Box 5 reconciles to movements on 2200 and 2201. Filing a return posts a journal clearing both to 2202 VAT control and locks the period.</p>
      <p>The system does not submit to HMRC. The export pack's vat_returns.csv and vat_detail.csv import into MTD-recognised software. CSV import and export count as a digital link under VAT Notice 700/22; copy and paste does not, so the figures should be imported rather than re-typed.</p>
      <h3>Bank</h3>
      <p>The Starling business account feeds in through Starling's API. Each line is matched to an invoice or bill, or coded with an account, VAT code and division, and keeps a link to the transaction it created. The Bank page reconciles the statement balance to the ledger to the penny.</p>
      <h3>Payroll</h3>
      <p>Hours and rates are captured per employee and exported as payroll.csv. RTI submissions are made by the payroll provider in HMRC-recognised software; their final figures are entered back and posted as one journal per run (gross wages and employer NIC by division, PAYE/NIC to 2210, net pay to 2220, Employment Allowance offset).</p>
      <h3>Controls</h3>
      <ul>
        <li>Sign-in is required. Each person has a role: owner, director, bookkeeper or accountant. The accountant can read everything, post journals, mark VAT returns filed and move the lock date, but cannot change or delete trading entries.</li>
        <li>Period lock: nothing dated on or before the lock date can be added, changed or deleted. The database enforces this as well as the screen.</li>
        <li>Audit trail: the database records every insert, change and delete with the user, time and the full before and after values. Entries cannot be edited or removed.</li>
        <li>Sales invoices use one unbroken number sequence across all divisions. Draft invoices are not numbered and post nothing.</li>
        <li>Records are retained for at least six years from the end of the financial year they relate to.</li>
      </ul>
      <h3>Rates built in (${E.PAYROLL.taxYear})</h3>
      <p>Corporation tax 19% to £50,000, 25% from £250,000, marginal relief between (3/200), limits divided by associated companies and scaled for short periods. VAT registration threshold £90,000. Employer NIC 15% above £5,000 a year, employee NIC 8% between £12,570 and £50,270, Employment Allowance £10,500. Approved mileage 45p for the first 10,000 miles, then 25p, plus 5p per passenger.</p>
      <h3>Outside this system</h3>
      <p>Statutory accounts and filing at Companies House, the CT600, RTI submissions and the MTD VAT submission itself are done in the accountant's own software from the export pack. Year-end adjustments come back in as journals.</p>
    </div></section>
  </div>`;
};

/* ============================================================
   Editors: invoices, bills, bank coding, journals, payments
   ============================================================ */
const DOC_TITLES = { invoice: 'Invoice', credit_note: 'Credit note', bill: 'Bill', supplier_credit: 'Supplier credit', receipt: 'Receive money', spend: 'Spend money' };
const isSalesType = (t) => ['invoice', 'credit_note', 'receipt'].includes(t);
const incomeDivision = (code) => Object.keys(E.INCOME_FOR_DIVISION).find(k => E.INCOME_FOR_DIVISION[k] === code) || null;
const clone = (o) => JSON.parse(JSON.stringify(o));

function blankLine(type, division) {
  const account = isSalesType(type) ? (E.INCOME_FOR_DIVISION[division] || '4000') : '5000';
  const a = ACC()[account] || {};
  return { id: uid(), description: '', account, qty: isSalesType(type) && type !== 'receipt' ? 1 : null, unitPrice: null, amount: '', vatCode: a.vatDefault || 'S20', net: 0, vat: 0, division: division || null };
}
function recalcLine(l, inclusive, active) {
  if (!active) { l.vatCode = 'NR'; }
  if (l.qty != null && l.unitPrice !== null && l.unitPrice !== '' && l.qty !== '') l.amount = E.r2((+l.qty || 0) * (+l.unitPrice || 0));
  const c = E.calcLine(+l.amount || 0, l.vatCode, inclusive);
  l.net = c.net; l.vat = c.vat;
}

function txnEditor(existing, preset) {
  const t0 = existing ? clone(existing) : Object.assign({ id: uid(), type: preset.type, date: today(), status: preset.type === 'invoice' || preset.type === 'credit_note' ? 'draft' : 'approved', division: UI.div !== 'all' ? UI.div : null, lines: [] }, preset || {});
  const doc = t0;
  const readOnly = !can.edit() || lockedDate(doc.date) || doc.status === 'void';
  if (!doc.lines.length) doc.lines.push(blankLine(doc.type, doc.division));
  if (doc.dueDate == null && ['invoice', 'bill'].includes(doc.type)) doc.dueDate = E.addDays(doc.date, +S.company.paymentTerms || 30);
  doc.lines.forEach(l => { if (l.amount == null || l.amount === '') l.amount = doc.inclusive ? E.r2(+l.net + +l.vat) : +l.net; });
  const sales = isSalesType(doc.type);
  const bankTyped = ['receipt', 'spend'].includes(doc.type);
  const showQty = ['invoice', 'credit_note'].includes(doc.type);

  const headFields = () => `<div class="grid cols-4">
    ${field(sales ? 'Customer' : 'Supplier', sel('contactId', contactOptions(doc.contactId, sales ? 'customer' : 'supplier'), readOnly ? 'disabled' : 'data-h="1"'), 2)}
    ${field('Date', inp('date', doc.date, 'date', readOnly ? 'readonly' : 'data-h="1"'))}
    ${['invoice', 'bill', 'credit_note', 'supplier_credit'].includes(doc.type) ? field('Due', inp('dueDate', doc.dueDate || '', 'date', readOnly ? 'readonly' : 'data-h="1"')) : field('Bank account', sel('bankAccount', accountOptions(doc.bankAccount || '1200', a => a.type === 'bank'), readOnly ? 'disabled' : 'data-h="1"'))}
    ${field('Division', sel('division', divOptions(doc.division), readOnly ? 'disabled' : 'data-h="1"'))}
    ${field('Job code', sel('jobCode', jobOptions(doc.jobCode), readOnly ? 'disabled' : 'data-h="1"'))}
    ${field(doc.type === 'invoice' ? 'Invoice number' : 'Reference', inp('ref', doc.type === 'invoice' && !doc.ref ? '' : doc.ref || '', 'text', (doc.type === 'invoice' ? 'readonly placeholder="Given when approved"' : readOnly ? 'readonly' : 'data-h="1"')))}
    ${field('Amounts are', sel('inclusive', `<option value="0"${!doc.inclusive ? ' selected' : ''}>VAT exclusive</option><option value="1"${doc.inclusive ? ' selected' : ''}>VAT inclusive</option>`, readOnly || !vatOn(doc.date) ? 'disabled' : 'data-h="1"'))}
    ${field('Description', inp('description', doc.description || '', 'text', readOnly ? 'readonly' : 'data-h="1"'), 4)}
  </div>`;
  const linesHtml = () => {
    const active = vatOn(doc.date);
    return `<div class="lines">
      <div class="line head"><span>Description</span><span>Account</span><span>${showQty ? 'Qty' : ''}</span><span>${showQty ? 'Unit price' : ''}</span><span>${doc.inclusive ? 'Gross' : 'Net'} amount</span><span>VAT code</span><span>VAT · division</span><span></span></div>
      ${doc.lines.map((l, i) => `<div class="line">
        <input class="input" data-l="description" data-i="${i}" value="${esc(l.description || '')}" placeholder="Description" aria-label="Line description" ${readOnly ? 'readonly' : ''}>
        <select class="input" data-l="account" data-i="${i}" aria-label="Account" ${readOnly ? 'disabled' : ''}>${accountOptions(l.account)}</select>
        ${showQty ? `<input class="input num" type="number" step="any" data-l="qty" data-i="${i}" value="${l.qty == null ? '' : l.qty}" aria-label="Quantity" ${readOnly ? 'readonly' : ''}>` : '<span></span>'}
        ${showQty ? `<input class="input num" type="number" step="0.01" data-l="unitPrice" data-i="${i}" value="${l.unitPrice == null ? '' : l.unitPrice}" aria-label="Unit price" ${readOnly ? 'readonly' : ''}>` : '<span></span>'}
        <input class="input num" type="number" step="0.01" data-l="amount" data-i="${i}" value="${l.amount === '' ? '' : l.amount}" aria-label="Amount" ${readOnly || (showQty && l.unitPrice != null && l.unitPrice !== '') ? 'readonly' : ''}>
        <select class="input" data-l="vatCode" data-i="${i}" aria-label="VAT code" ${readOnly || !active ? 'disabled' : ''}>${vatOptions(active ? l.vatCode : 'NR')}</select>
        <div style="display:grid;gap:4px"><input class="input num" type="number" step="0.01" data-l="vat" data-i="${i}" value="${(+l.vat).toFixed(2)}" aria-label="VAT amount" ${readOnly || !active ? 'readonly' : ''}><select class="input" data-l="division" data-i="${i}" aria-label="Line division" ${readOnly ? 'disabled' : ''}>${divOptions(l.division)}</select></div>
        ${readOnly ? '<span></span>' : `<button class="btn sm plain" data-rm="${i}" aria-label="Remove line">${ico('x')}</button>`}
      </div>`).join('')}
      ${readOnly ? '' : `<div><button class="btn sm tinted" data-addline="1">${ico('plus')} Add line</button></div>`}
    </div>`;
  };
  const totalsHtml = () => { const tt = E.lineTotals(doc.lines); return `<div class="totals"><div><span class="muted">Net</span><span>${money(tt.net)}</span></div>${vatOn(doc.date) ? `<div><span class="muted">VAT</span><span>${money(tt.vat)}</span></div>` : ''}<div class="grand"><span>Total</span><span>${money(tt.gross)}</span></div></div>`; };

  const st = existing && ['invoice', 'bill', 'credit_note', 'supplier_credit'].includes(doc.type) ? E.docStatus(S, existing, today()) : null;
  const notes = [];
  if (lockedDate(doc.date)) notes.push(callout('warn', `Dated inside the locked period (up to ${fdate(S.company.lockDate)}). Read only.`));
  if (doc.status === 'void') notes.push(callout('warn', 'This document is void and posts nothing.'));
  if (!vatOn(doc.date) && S.company.vatRegistered) notes.push(callout('', 'Dated before VAT registration, so no VAT applies.'));

  const foot = readOnly ? `<button class="btn" data-sheet-close-btn>Close</button>` :
    `<span class="left">${st ? statusPill(st) : ''}</span>
    ${existing && doc.status !== 'void' ? (doc.type === 'invoice' && doc.ref ? `<button class="btn danger" data-x="void">Void</button>` : `<button class="btn danger" data-x="delete">Delete</button>`) : ''}
    ${doc.type === 'invoice' || doc.type === 'credit_note' ? (doc.status === 'draft' ? `<button class="btn" data-x="draft">Save draft</button><button class="btn primary" data-x="approve">Approve${doc.type === 'invoice' ? ' and number' : ''}</button>` : `<button class="btn primary" data-x="save">Save</button>`) :
      `${doc.status === 'draft' ? `<button class="btn" data-x="draft">Save draft</button>` : ''}<button class="btn primary" data-x="approve">${existing ? 'Save' : 'Save and post'}</button>`}`;

  const sheet = openSheet({ title: `${DOC_TITLES[doc.type]}${doc.ref ? ' ' + doc.ref : existing ? '' : ' — new'}`, size: 'wide', sticky: true,
    body: `${notes.join('')}<div id="ed-head">${headFields()}</div><div id="ed-lines">${linesHtml()}</div><div id="ed-totals" style="display:grid">${totalsHtml()}</div>`, foot });
  const refresh = (all) => keepFocus(sheet, () => { if (all) $('#ed-head', sheet).innerHTML = headFields(); $('#ed-lines', sheet).innerHTML = linesHtml(); $('#ed-totals', sheet).innerHTML = totalsHtml(); });
  const closeBtn = sheet.querySelector('[data-sheet-close-btn]'); if (closeBtn) closeBtn.onclick = closeSheet;

  sheet.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.h) {
      const k = el.getAttribute('data-k'); const prevDiv = doc.division;
      doc[k] = k === 'inclusive' ? el.value === '1' : (el.value || null);
      if (k === 'division') doc.lines.forEach(l => { if (!l.division || l.division === prevDiv) { l.division = doc.division; if (isSalesType(doc.type) && incomeDivision(l.account) && E.INCOME_FOR_DIVISION[doc.division]) { l.account = E.INCOME_FOR_DIVISION[doc.division]; const a = ACC()[l.account]; if (a) l.vatCode = a.vatDefault; } } });
      if (k === 'contactId' && !existing) { const c = (S.contacts || []).find(x => x.id === doc.contactId); if (c && c.division && !doc.division) { doc.division = c.division; doc.lines.forEach(l => { if (!l.division) { l.division = c.division; if (isSalesType(doc.type) && incomeDivision(l.account) && E.INCOME_FOR_DIVISION[c.division]) { l.account = E.INCOME_FOR_DIVISION[c.division]; const a = ACC()[l.account]; if (a) l.vatCode = a.vatDefault; } } }); } }
      if (k === 'date' && ['invoice', 'bill'].includes(doc.type) && !existing) doc.dueDate = E.addDays(doc.date, +S.company.paymentTerms || 30);
      doc.lines.forEach(l => recalcLine(l, doc.inclusive, vatOn(doc.date)));
      refresh(k === 'date' || k === 'contactId' || k === 'division'); return;
    }
    if (el.dataset.l) {
      const l = doc.lines[+el.dataset.i]; const k = el.dataset.l; let v = el.value;
      if (['qty', 'unitPrice', 'amount', 'vat'].includes(k)) v = v === '' ? (k === 'amount' ? '' : null) : +v;
      if (k === 'division') v = v || null;
      l[k] = v;
      if (k === 'account') { const a = ACC()[v]; if (a && vatOn(doc.date)) l.vatCode = a.vatDefault || l.vatCode; const d = incomeDivision(v); if (d) l.division = d; }
      if (k === 'vat') { l.vat = E.r2(+v || 0); l.net = doc.inclusive ? E.r2((+l.amount || 0) - l.vat) : E.r2(+l.amount || 0); }
      else recalcLine(l, doc.inclusive, vatOn(doc.date));
      refresh(false);
    }
  });
  sheet.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]'); if (rm) { doc.lines.splice(+rm.dataset.rm, 1); if (!doc.lines.length) doc.lines.push(blankLine(doc.type, doc.division)); refresh(false); return; }
    if (e.target.closest('[data-addline]')) { doc.lines.push(blankLine(doc.type, doc.division)); refresh(false); return; }
    const x = e.target.closest('[data-x]'); if (!x) return;
    run(async () => {
      const action = x.dataset.x;
      if (action === 'delete') {
        if (!await confirmSheet('Delete', 'Delete this entry? It will be removed from the ledger. The audit trail keeps a copy.', 'Delete', true)) return;
        await removeRec('txns', doc.id, 'Deleted'); if (doc.bankLineId) await unlinkBankLine(doc.bankLineId); closeSheet(); render(); return;
      }
      if (action === 'void') {
        if (!await confirmSheet('Void invoice', `Void ${doc.ref}? It keeps its number in the sequence but posts nothing. Any payments allocated to it stay on the customer's account.`, 'Void', true)) return;
        doc.status = 'void'; doc.voidedAt = nowIso(); await persist('txns', doc, `${doc.ref} voided`); closeSheet(); render(); return;
      }
      // validate
      doc.lines = doc.lines.filter(l => (+l.amount || 0) !== 0 || (l.description || '').trim());
      if (!doc.lines.length) throw new Error('Add at least one line with an amount.');
      if (doc.lines.some(l => !l.account)) throw new Error('Every line needs an account.');
      if (['invoice', 'credit_note', 'bill', 'supplier_credit'].includes(doc.type) && !doc.contactId) throw new Error(`Choose a ${sales ? 'customer' : 'supplier'}.`);
      if (!doc.date) throw new Error('Enter a date.');
      doc.lines.forEach(l => { if (!vatOn(doc.date)) { l.vatCode = 'NR'; l.vat = 0; l.net = E.r2(+l.amount || 0); } });
      if (action === 'draft') doc.status = 'draft';
      if (action === 'approve') {
        if ((doc.type === 'invoice' || doc.type === 'credit_note') && !doc.ref) {
          const c = Object.assign({}, S.company); const no = +c.nextInvoiceNo || 1;
          doc.ref = (doc.type === 'credit_note' ? 'CN-' : (c.invoicePrefix || '')) + no;
          c.nextInvoiceNo = no + 1; await saveCompany(c);
        }
        doc.status = 'approved';
        if (doc.type === 'credit_note' && doc.creditFor && !(doc.allocations || []).length) {
          const inv = (S.txns || []).find(x => x.id === doc.creditFor);
          if (inv) { const due = E.docStatus(S, inv, today()).due; const amt = Math.min(due, E.lineTotals(doc.lines).gross); if (amt > 0) doc.allocations = [{ txnId: inv.id, amount: E.L(amt) }]; }
        }
      }
      await persist('txns', doc, `${DOC_TITLES[doc.type]} ${doc.ref || ''} saved`.replace(/\s+/g, ' '));
      if (preset && preset.bankLineId) { const bl = (S.bankLines || []).find(b => b.id === preset.bankLineId); if (bl) { bl.status = 'reconciled'; bl.txnId = doc.id; await store.save('bankLines', bl); } }
      closeSheet(); render();
      if (doc.type === 'invoice' && action === 'approve' && !existing) invoiceView(doc.id);
    });
  });
}

async function unlinkBankLine(blId) { const bl = (S.bankLines || []).find(b => b.id === blId); if (bl) { bl.status = 'unreconciled'; bl.txnId = null; await store.save('bankLines', bl); } }

ACT.newDoc = (el) => txnEditor(null, { type: el.dataset.type });
ACT.openDoc = (el) => openDoc(el.dataset.id);
function openDoc(idv) {
  const t = (S.txns || []).find(x => x.id === idv); if (!t) return;
  if (t.type === 'invoice' || t.type === 'credit_note') return t.status === 'draft' && can.edit() ? txnEditor(t) : invoiceView(t.id);
  if (['bill', 'supplier_credit', 'receipt', 'spend'].includes(t.type)) return txnEditor(t);
  if (t.type === 'journal' || t.type === 'payroll') return journalEditor(t);
  return paymentView(t);
}

// ---------- invoice document ----------
function invoiceDoc(inv) {
  const c = S.company; const d = E.DIVISIONS.find(x => x.id === inv.division);
  const cust = (S.contacts || []).find(x => x.id === inv.contactId) || {};
  const tt = E.lineTotals(inv.lines); const vat = vatOn(inv.date);
  const job = (S.jobCodes || []).find(j => j.code === inv.jobCode);
  const st = E.docStatus(S, inv, today());
  const isCN = inv.type === 'credit_note';
  const m = (p) => money(p);
  const vatByRate = {}; if (vat) inv.lines.forEach(l => { if (E.P(l.vat)) { const k = vatShort(l.vatCode); vatByRate[k] = (vatByRate[k] || 0) + E.P(l.vat); } });
  return `<div class="inv-doc">
    <div class="inv-top"><div class="inv-brand"><div class="nm">DIGBY'S</div><div class="st">${esc(d ? d.strap : 'Events & Catering')}</div></div>
      <div class="inv-title"><div class="w">${isCN ? 'CREDIT NOTE' : 'INVOICE'}</div><div class="no">${esc(inv.ref || 'DRAFT')}</div><div style="font-size:13px;margin-top:4px">${fdate(inv.date)}</div></div></div>
    <div class="inv-rule"></div>
    <div class="inv-two"><div><h4>Bill to</h4><div>${esc(cust.name || '')}</div>${cust.address ? `<div>${esc(cust.address).replace(/\n/g, '<br>')}</div>` : ''}${cust.email ? `<div>${esc(cust.email)}</div>` : ''}</div>
      <div><h4>${job ? 'Event' : 'Details'}</h4>${job ? `<div>${esc(job.name)}</div>${job.eventDate ? `<div>${fdate(job.eventDate)}</div>` : ''}` : ''}${inv.jobCode ? `<div>Job code ${esc(inv.jobCode)}</div>` : ''}${inv.description && !job ? `<div>${esc(inv.description)}</div>` : ''}${vat ? `<div>Tax point ${fdate(inv.date)}</div>` : ''}</div></div>
    <table class="inv-table"><thead><tr><th>Description</th><th class="r">Unit price</th><th class="r">Qty</th>${vat ? '<th class="r">VAT</th>' : ''}<th class="r">Total</th></tr></thead><tbody>
      ${inv.lines.map(l => `<tr><td>${esc(l.description || acctName(l.account))}</td><td class="r">${l.unitPrice != null && l.unitPrice !== '' ? m(E.P(l.unitPrice)) : ''}</td><td class="r">${l.qty != null && l.qty !== '' ? l.qty : ''}</td>${vat ? `<td class="r">${vatShort(l.vatCode)}</td>` : ''}<td class="r">${m(E.P(l.net))}</td></tr>`).join('')}
    </tbody></table>
    <div class="inv-sum"><div><span>Subtotal</span><span>${m(tt.net)}</span></div>${vat ? Object.entries(vatByRate).map(([k, v]) => `<div><span>VAT at ${k}</span><span>${m(v)}</span></div>`).join('') : ''}${st.paid && !isCN ? `<div><span>Paid</span><span>−${m(st.paid)}</span></div>` : ''}</div>
    <div class="inv-due"><span>${isCN ? 'TOTAL CREDIT' : 'TOTAL DUE'}</span><span>${m(isCN ? tt.gross : (st.key === 'draft' ? tt.gross : st.due))}</span></div>
    ${isCN ? '' : `<div class="inv-pay"><div><h4 style="margin:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a807a">Payment details</h4>Account name: ${esc(c.bankAccountName || c.name)}<br>Sort code: ${esc(c.bankSort || '')}<br>Account number: ${esc(c.bankAccountNo || '')}<br>Reference: ${esc(inv.jobCode || inv.ref || '')}</div>
      <div><h4 style="margin:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a807a">Terms</h4>Payment due by ${fdate(inv.dueDate)}${c.paymentTerms ? ` (${c.paymentTerms} days)` : ''}.<br>${c.email ? esc(c.email) : ''}${c.phone ? '<br>' + esc(c.phone) : ''}</div></div>`}
    <div class="inv-thanks">Thank you for choosing Digby's.</div>
    <div class="inv-legal">${esc(c.name)} · Registered in ${esc(c.registeredIn || 'England and Wales')} · Company no. ${esc(c.companyNo || '')} · Registered office: ${esc(c.regOffice || '')}${vat ? ' · VAT no. ' + esc(c.vatNumber || '') : ''}</div>
  </div>`;
}
function invoiceStandalone(inv) {
  const css = Array.from(document.styleSheets).map(s => { try { return Array.from(s.cssRules).map(r => r.cssText).filter(t => /\.inv-/.test(t)).join('\n'); } catch (e) { return ''; } }).join('\n');
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.ref || 'Invoice')} — ${esc(S.company.name)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&display=swap"><style>:root{--font-brand:"Lora",Georgia,serif;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--shadow:none}body{margin:0;background:#fff}@page{size:A4;margin:0}${css}</style></head><body>${invoiceDoc(inv)}</body></html>`;
}

function invoiceView(idv) {
  const inv = (S.txns || []).find(x => x.id === idv); if (!inv) return;
  const st = E.docStatus(S, inv, today());
  const pays = (S.txns || []).filter(t => (t.allocations || []).some(a => a.txnId === inv.id) && E.POSTED(t));
  const editable = can.edit() && !lockedDate(inv.date) && inv.status !== 'void';
  const sh = openSheet({ title: `${inv.type === 'credit_note' ? 'Credit note' : 'Invoice'} ${inv.ref || 'draft'}`, size: 'wide', noFocus: true,
    body: `<div class="head-actions" style="justify-content:space-between">${statusPill(st)}<span class="muted" style="font-size:13px">${divChip(inv.division)} ${inv.sentAt ? '· sent ' + fdate(inv.sentAt) : ''} ${lockedDate(inv.date) ? '· locked' : ''}</span></div>
      ${invoiceDoc(inv)}
      ${pays.length ? `<section class="panel"><div class="panel-head"><h2>Payments</h2></div><div class="list">${pays.map(p => `<button class="list-row" data-act="openDoc" data-id="${p.id}"><span class="grow"><span class="title">${fdate(p.date)}</span><span class="meta">${esc(p.type.replace('_', ' '))} ${esc(p.ref || '')}</span></span><span class="num">${money(E.P((p.allocations.find(a => a.txnId === inv.id) || {}).amount))}</span></button>`).join('')}</div></section>` : ''}`,
    foot: `<span class="left">${money(st.gross)} · ${st.due ? money(st.due) + ' outstanding' : 'settled'}</span>
      <button class="btn" data-v="download">${ico('down')} Download</button>
      ${!inArtifact() ? `<button class="btn" data-v="print">Print or save PDF</button>` : ''}
      ${editable && inv.type === 'invoice' && inv.status !== 'draft' ? `<button class="btn" data-v="credit">Credit note</button>` : ''}
      ${editable ? `<button class="btn" data-v="edit">Edit</button>` : ''}
      ${editable && inv.type === 'invoice' && !inv.sentAt && inv.status === 'approved' ? `<button class="btn tinted" data-v="sent">Mark sent</button>` : ''}
      ${can.edit() && st.due > 0 && inv.type === 'invoice' && inv.status === 'approved' ? `<button class="btn primary" data-v="pay">Record payment</button>` : ''}` });
  sh.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    run(async () => {
      const v = b.dataset.v;
      if (v === 'download') return saveFile(`${inv.ref || 'invoice-draft'}.html`, invoiceStandalone(inv), 'text/html');
      if (v === 'print') { const w = window.open('', '_blank'); if (!w) throw new Error('Allow pop-ups to print the invoice.'); w.document.write(invoiceStandalone(inv)); w.document.close(); setTimeout(() => w.print(), 600); return; }
      if (v === 'edit') { closeSheet(); return txnEditor(inv); }
      if (v === 'sent') { inv.sentAt = today(); await persist('txns', inv, 'Marked sent'); closeSheet(); render(); return invoiceView(inv.id); }
      if (v === 'pay') { closeSheet(); return paymentSheet(inv); }
      if (v === 'credit') { closeSheet(); return txnEditor(null, { type: 'credit_note', contactId: inv.contactId, division: inv.division, jobCode: inv.jobCode, description: `Credit against ${inv.ref}`, creditFor: inv.id, allocations: [], lines: inv.lines.map(l => Object.assign(clone(l), { id: uid() })) }); }
    });
  });
}

// ---------- payments ----------
function paymentSheet(doc, bankLine) {
  const st = E.docStatus(S, doc, today()); const sales = doc.type === 'invoice';
  const amt = bankLine ? Math.abs(E.P(bankLine.amount)) : st.due;
  const sh = openSheet({ title: `Record ${sales ? 'payment received' : 'payment made'}`, size: 'narrow',
    body: `<p class="muted" style="margin:0">${esc(doc.ref || '')} · ${esc(contactName(doc.contactId))} · ${money(st.due)} outstanding</p>
    <div class="grid cols-2">${field('Amount', inp('amount', (amt / 100).toFixed(2), 'number', 'step="0.01"'))}${field('Date', inp('date', bankLine ? bankLine.date : today(), 'date'))}${field('Paid into', sel('bankAccount', accountOptions('1200', a => a.type === 'bank')))}${field('Reference', inp('ref', bankLine ? bankLine.reference : doc.ref))}</div>`,
    foot: `<button class="btn" data-p="cancel">Cancel</button><button class="btn primary" data-p="ok">Save payment</button>` });
  sh.querySelector('[data-p="cancel"]').onclick = closeSheet;
  sh.querySelector('[data-p="ok"]').onclick = () => run(async () => {
    const f = readForm(sh); const a = E.r2(f.amount);
    if (!(a > 0)) throw new Error('Enter an amount above zero.');
    if (E.P(a) > st.due + 1) throw new Error(`That is more than the ${money(st.due)} outstanding.`);
    const p = { id: uid(), type: sales ? 'customer_payment' : 'supplier_payment', date: f.date, contactId: doc.contactId, amount: a, bankAccount: f.bankAccount, ref: f.ref, description: `Payment ${doc.ref || ''}`.trim(), division: doc.division, allocations: [{ txnId: doc.id, amount: a }], status: 'approved', bankLineId: bankLine ? bankLine.id : null };
    await persist('txns', p, 'Payment saved');
    if (bankLine) { bankLine.status = 'reconciled'; bankLine.txnId = p.id; await store.save('bankLines', bankLine); }
    closeSheet(); render();
  });
}

// ---------- journals ----------
function journalEditor(existing) {
  const j = existing ? clone(existing) : { id: uid(), type: 'journal', date: today(), ref: '', description: '', status: 'approved', lines: [{ account: '', description: '', division: null, debit: 0, credit: 0 }, { account: '', description: '', division: null, debit: 0, credit: 0 }] };
  const readOnly = !can.journal() || lockedDate(j.date) || j.type === 'payroll' || (existing && !can.edit() && existing.createdBy !== store.user.email);
  const body = () => { const dr = j.lines.reduce((s, l) => s + E.P(l.debit), 0), cr = j.lines.reduce((s, l) => s + E.P(l.credit), 0);
    return `${j.type === 'payroll' ? callout('', 'Posted from a pay run. Change it on the Payroll page.') : ''}${lockedDate(j.date) ? callout('warn', 'Inside the locked period. Read only.') : ''}
    <div class="grid cols-3">${field('Date', inp('date', j.date, 'date', readOnly ? 'readonly' : ''))}${field('Reference', inp('ref', j.ref, 'text', readOnly ? 'readonly' : ''))}${field('Narrative', inp('description', j.description, 'text', readOnly ? 'readonly' : ''))}</div>
    <div class="lines"><div class="line j head"><span>Account</span><span>Description</span><span>Division</span><span>Debit</span><span>Credit</span><span></span></div>
    ${j.lines.map((l, i) => `<div class="line j"><select class="input" data-j="account" data-i="${i}" aria-label="Account" ${readOnly ? 'disabled' : ''}><option value="">Choose…</option>${accountOptions(l.account)}</select><input class="input" data-j="description" data-i="${i}" value="${esc(l.description || '')}" aria-label="Line description" ${readOnly ? 'readonly' : ''}><select class="input" data-j="division" data-i="${i}" aria-label="Division" ${readOnly ? 'disabled' : ''}>${divOptions(l.division)}</select><input class="input num" type="number" step="0.01" data-j="debit" data-i="${i}" value="${+l.debit || ''}" aria-label="Debit" ${readOnly ? 'readonly' : ''}><input class="input num" type="number" step="0.01" data-j="credit" data-i="${i}" value="${+l.credit || ''}" aria-label="Credit" ${readOnly ? 'readonly' : ''}>${readOnly ? '<span></span>' : `<button class="btn sm plain" data-jrm="${i}" aria-label="Remove line">${ico('x')}</button>`}</div>`).join('')}
    ${readOnly ? '' : `<div><button class="btn sm tinted" data-jadd="1">${ico('plus')} Add line</button></div>`}</div>
    <div class="totals"><div><span class="muted">Debits</span><span>${money(dr)}</span></div><div><span class="muted">Credits</span><span>${money(cr)}</span></div><div class="grand"><span>Difference</span><span class="${dr !== cr ? 'neg' : ''}">${money(dr - cr)}</span></div></div>`; };
  const sh = openSheet({ title: existing ? `${j.type === 'payroll' ? 'Payroll journal' : 'Journal'} ${j.ref || ''}` : 'New journal', size: 'wide', sticky: !readOnly, body: `<div id="jb">${body()}</div>`,
    foot: readOnly ? `<button class="btn" data-jx="close">Close</button>` : `${existing ? `<button class="btn danger" data-jx="delete">Delete</button>` : ''}<button class="btn" data-jx="close">Cancel</button><button class="btn primary" data-jx="save">Post journal</button>` });
  const re = () => keepFocus(sh, () => { $('#jb', sh).innerHTML = body(); });
  sh.addEventListener('change', (e) => { const el = e.target; if (el.dataset.j) { const l = j.lines[+el.dataset.i]; l[el.dataset.j] = ['debit', 'credit'].includes(el.dataset.j) ? E.r2(+el.value || 0) : (el.value || null); if (el.dataset.j === 'debit' && l.debit) l.credit = 0; if (el.dataset.j === 'credit' && l.credit) l.debit = 0; re(); } else if (el.dataset.k) { j[el.dataset.k] = el.value; if (el.dataset.k === 'date') re(); } });
  sh.addEventListener('click', (e) => {
    if (e.target.closest('[data-jadd]')) { j.lines.push({ account: '', description: '', division: null, debit: 0, credit: 0 }); re(); return; }
    const rm = e.target.closest('[data-jrm]'); if (rm) { j.lines.splice(+rm.dataset.jrm, 1); re(); return; }
    const x = e.target.closest('[data-jx]'); if (!x) return;
    run(async () => {
      if (x.dataset.jx === 'close') return closeSheet();
      if (x.dataset.jx === 'delete') { if (!await confirmSheet('Delete journal', 'Delete this journal?', 'Delete', true)) return; await removeRec('txns', j.id, 'Journal deleted'); closeSheet(); render(); return; }
      j.lines = j.lines.filter(l => l.account && (E.P(l.debit) || E.P(l.credit)));
      const dr = j.lines.reduce((s, l) => s + E.P(l.debit), 0), cr = j.lines.reduce((s, l) => s + E.P(l.credit), 0);
      if (j.lines.length < 2) throw new Error('A journal needs at least two lines.');
      if (dr !== cr) throw new Error(`Debits and credits differ by ${money(dr - cr)}.`);
      if (!j.description) throw new Error('Add a narrative so the entry explains itself.');
      await persist('txns', j, 'Journal posted'); closeSheet(); render();
    });
  });
}
ACT.newJournal = () => journalEditor(null);

// ---------- bank reconciliation ----------
async function postFromBank(bl, opts) {
  const amt = E.P(bl.amount); const type = amt > 0 ? 'receipt' : 'spend';
  const active = vatOn(bl.date); const code = active ? (opts.vatCode || 'NR') : 'NR';
  const c = E.calcLine(Math.abs(amt) / 100, code, true);
  const t = { id: uid(), type, date: bl.date, contactId: opts.contactId || null, description: opts.description || `${bl.counterparty} ${bl.reference || ''}`.trim(), division: opts.division || null, jobCode: opts.jobCode || null,
    bankAccount: bl.account || '1200', status: 'approved', inclusive: true, bankLineId: bl.id,
    lines: [{ id: uid(), description: opts.description || bl.reference || bl.counterparty, account: opts.account, vatCode: code, net: c.net, vat: c.vat, amount: Math.abs(amt) / 100, division: opts.division || null, jobCode: opts.jobCode || null }] };
  await persist('txns', t);
  bl.status = 'reconciled'; bl.txnId = t.id; await store.save('bankLines', bl);
  return t;
}
async function acceptSuggestion(bl) {
  const sg = suggestFor(bl); if (!sg) return false;
  if (lockedDate(bl.date)) throw new Error(`${fdate(bl.date)} is in the locked period.`);
  if (sg.kind === 'match') {
    const doc = sg.doc; const a = Math.abs(E.P(bl.amount)) / 100;
    const p = { id: uid(), type: doc.type === 'invoice' ? 'customer_payment' : 'supplier_payment', date: bl.date, contactId: doc.contactId, amount: a, bankAccount: bl.account || '1200', ref: bl.reference || doc.ref, description: `Payment ${doc.ref || ''}`.trim(), division: doc.division, allocations: [{ txnId: doc.id, amount: a }], status: 'approved', bankLineId: bl.id };
    await persist('txns', p); bl.status = 'reconciled'; bl.txnId = p.id; await store.save('bankLines', bl);
  } else {
    const r = sg.rule; await postFromBank(bl, { account: r.account, vatCode: r.vatCode, division: r.division, contactId: r.contactId, jobCode: r.jobCode });
  }
  return true;
}
ACT.acceptLine = async (el) => { const bl = S.bankLines.find(b => b.id === el.dataset.id); if (await acceptSuggestion(bl)) { toast('Reconciled'); render(); } };
ACT.acceptAll = async () => { let n = 0; for (const bl of S.bankLines.filter(b => b.status === 'unreconciled')) { if (suggestFor(bl) && !lockedDate(bl.date)) { await acceptSuggestion(bl); n++; } } toast(`${plural(n, 'line')} reconciled`); render(); };
ACT.excludeLine = async (el) => { const bl = S.bankLines.find(b => b.id === el.dataset.id); if (!await confirmSheet('Exclude bank line', `Exclude ${esc(bl.counterparty)} ${money(E.P(bl.amount))} from reconciliation? Use this only for duplicates or lines that never cleared.`, 'Exclude')) return; bl.status = 'excluded'; await store.save('bankLines', bl); toast('Excluded'); render(); };
ACT.codeLine = (el) => {
  const bl = S.bankLines.find(b => b.id === el.dataset.id); const amt = E.P(bl.amount); const sg = suggestFor(bl); const r = sg && sg.kind === 'rule' ? sg.rule : {};
  const sales = amt > 0; const defAcc = r.account || (sales ? '4000' : '5000');
  const sh = openSheet({ title: `${sales ? 'Money in' : 'Money out'} · ${money(amt)}`, size: 'narrow',
    body: `<p class="muted" style="margin:0">${fdate(bl.date)} · ${esc(bl.counterparty)} · ${esc(bl.reference || '')}</p>
    <div class="grid cols-2">${field('Account', sel('account', accountOptions(defAcc)), 2)}${field('VAT code', sel('vatCode', vatOptions(vatOn(bl.date) ? (r.vatCode || (ACC()[defAcc] || {}).vatDefault || 'S20') : 'NR'), vatOn(bl.date) ? '' : 'disabled'))}${field('Division', sel('division', divOptions(r.division || incomeDivision(defAcc))))}
    ${field(sales ? 'Customer' : 'Supplier', sel('contactId', contactOptions(r.contactId, sales ? 'customer' : 'supplier')))}${field('Job code', sel('jobCode', jobOptions(r.jobCode)))}${field('Description', inp('description', `${bl.counterparty} ${bl.reference || ''}`.trim()), 2)}
    ${can.edit() ? `<div style="grid-column:1/-1">${chk('makeRule', false, `Always code ${bl.counterparty} like this`)}</div>` : ''}</div>`,
    foot: `<button class="btn" data-c="x">Cancel</button><button class="btn primary" data-c="ok">Reconcile</button>` });
  sh.querySelector('[data-k="account"]').addEventListener('change', (e) => { const a = ACC()[e.target.value]; if (a && vatOn(bl.date)) $('[data-k="vatCode"]', sh).value = a.vatDefault || 'S20'; const d = incomeDivision(e.target.value); if (d) $('[data-k="division"]', sh).value = d; });
  sh.querySelector('[data-c="x"]').onclick = closeSheet;
  sh.querySelector('[data-c="ok"]').onclick = () => run(async () => {
    const f = readForm(sh); if (lockedDate(bl.date)) throw new Error('That date is in the locked period.');
    await postFromBank(bl, f);
    if (f.makeRule) await store.save('rules', { id: uid(), match: (bl.counterparty || '').toUpperCase(), direction: sales ? 'in' : 'out', action: 'code', account: f.account, vatCode: f.vatCode, division: f.division || null, contactId: f.contactId || null });
    closeSheet(); toast('Reconciled'); render();
  });
};
ACT.matchLine = (el) => {
  const bl = S.bankLines.find(b => b.id === el.dataset.id); const amt = E.P(bl.amount);

    body: docs.length ? `<div class="panel"><div class="list">${docs.slice(0, 30).map(d => `<button class="list-row" data-m="${d.x.id}"><span class="grow"><span class="title">${esc(d.x.ref || '')} · ${esc(contactName(d.x.contactId))}</span><span class="meta">${fdate(d.x.date)} · ${divName(d.x.division)}</span></span><span class="num">${money(d.st.due)}</span>${d.st.due === Math.abs(amt) ? '<span class="pill good">Exact</span>' : ''}</button>`).join('')}</div></div>` : emptyState('Nothing open', `No ${amt > 0 ? 'invoices' : 'bills'} are waiting for payment.`) });

ACT.syncBank = async () => {
  if (store.mode === 'demo') { S.lastSync = nowIso(); toast('Bank feed is up to date'); render(); return; }
  const from = E.addDays(today(), -45); const res = await store.starling(S.company.incorporated && S.company.incorporated > from ? S.company.incorporated : from, today());
  const have = new Set((S.bankLines || []).map(b => b.id)); let n = 0;
  for (const tx of (res.transactions || [])) {
    if (!tx.feedItemUid || have.has(tx.feedItemUid)) continue;
    if (S.company.incorporated && tx.date < S.company.incorporated) continue;
    await store.save('bankLines', { id: tx.feedItemUid, account: '1200', date: tx.date, amount: E.r2(tx.amount), counterparty: tx.counterParty, reference: tx.reference, category: tx.starlingCat || '', status: 'unreconciled', txnId: null }); n++;
  }
  if (res.balance != null) S.starlingBalance = res.balance;
  S.lastSync = nowIso(); toast(n ? `${plural(n, 'new bank line')}` : 'Bank feed is up to date'); render();
};

ACT.trackTrip = () => {
  if (!navigator.geolocation) throw new Error('This device does not offer location.');
  let watch = null, last = null, miles = 0, started = Date.now(), wake = null;
  const hav = (a, b) => { const R = 3958.8, toR = (x) => x * Math.PI / 180; const dLa = toR(b.lat - a.lat), dLo = toR(b.lon - a.lon); const h = Math.sin(dLa / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  const sh = openSheet({ title: 'Track a trip', size: 'narrow', sticky: true, noFocus: true, body: `<div style="text-align:center;display:grid;gap:6px;padding:18px 0"><div id="trk-mi" style="font:700 54px/1 var(--font-display);font-variant-numeric:tabular-nums">0.0</div><div class="muted">miles</div><div id="trk-st" class="faint">Waiting for GPS…</div></div>${callout('', 'Keep this screen open while driving. Readings less accurate than 60 metres are ignored.')}`,
    foot: `<button class="btn" data-t="x">Cancel</button><button class="btn primary" data-t="stop">Stop and log</button>` });
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {});
  watch = navigator.geolocation.watchPosition((pos) => {
    const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    $('#trk-st', sh).textContent = `Accuracy ${Math.round(pos.coords.accuracy)} m · ${Math.round((Date.now() - started) / 60000)} min`;
    if (pos.coords.accuracy > 60) return; if (last) { const d = hav(last, p); if (d > 0.01) { miles += d; last = p; } } else last = p;
    $('#trk-mi', sh).textContent = miles.toFixed(1);
  }, (err) => { $('#trk-st', sh).textContent = err.code === 1 ? 'Location permission was refused. Allow it in the browser settings, or log the trip by hand.' : 'GPS unavailable: ' + err.message; }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  const stop = () => { if (watch != null) navigator.geolocation.clearWatch(watch); if (wake) wake.release().catch(() => {}); };
  sh.querySelector('[data-t="x"]').onclick = () => { stop(); closeSheet(); };
  sh.querySelector('[data-t="stop"]').onclick = () => { stop(); closeSheet(); ACT.editTrip({ dataset: {}, preset: { miles: Math.round(miles * 10) / 10, method: 'gps' } }); };
};
ACT.postMileage = async () => {
  const ty = E.taxYearStart(today()); const claims = E.mileageClaims(S, ty);
  const dirs = S.company.directors || []; let posted = 0;
  for (const c of claims) {
    const open = c.trips.filter(x => !x.claimTxnId && !lockedDate(x.date)); if (!open.length) continue;
    const amt = open.reduce((s, x) => s + x.claimP, 0); const d = dirs.find(x => x.name === c.driver);
    const date = open.map(x => x.date).sort().slice(-1)[0];
    const t = { id: uid(), type: 'journal', date, ref: 'MIL-' + date.slice(0, 7), description: `Mileage claim — ${c.driver} (${open.reduce((s, x) => s + (+x.miles || 0), 0)} miles)`, status: 'approved',
      lines: [{ account: '7304', debit: E.L(amt), credit: 0, description: `${plural(open.length, 'trip')} at approved mileage rates` }, { account: d ? d.dla : '2109', debit: 0, credit: E.L(amt), description: d ? 'Owed to director' : 'Owed to employee — pay with next payroll' }] };
    await persist('txns', t);
    for (const x of open) { const m = S.mileage.find(y => y.id === x.id); m.claimTxnId = t.id; await store.save('mileage', m); }
    posted++;
  }
  toast(posted ? `Posted ${plural(posted, 'claim')}` : 'Nothing to post'); render();
};

ACT.dividend = () => {
  const dirs = S.company.directors || []; const cy = E.companyYear(S.company, today());
  const bs = E.balanceSheet(S, { at: today() }); const ct = E.ctEstimate(S, cy);
  const reserves = bs.totals.equity - ((bs.equity.find(r => r.code === '3000') || {}).amount || 0) - ct.tax;
  const sh = openSheet({ title: 'Declare dividend', size: 'narrow', body: `${callout(reserves > 0 ? '' : 'bad', `Distributable reserves are about ${money(reserves)} after the corporation tax estimate. A dividend above that is unlawful. Confirm the figure with your accountant before declaring.`)}
    <div class="grid cols-2">${field('Total dividend', inp('amount', '', 'number', 'step="0.01"'))}${field('Date declared', inp('date', today(), 'date'))}</div>
    <p class="muted" style="margin:0;font-size:13px">Split by shareholding: ${dirs.map(d => `${esc(d.name)} ${d.share}%`).join(', ')}. Each share is credited to that director's loan account, ready to be paid out.</p>`,
    foot: `<button class="btn" data-c="x">Cancel</button><button class="btn primary" data-c="ok">Post dividend</button>` });
  sh.querySelector('[data-c="x"]').onclick = closeSheet;
  sh.querySelector('[data-c="ok"]').onclick = () => run(async () => {
    const f = readForm(sh); const total = E.P(f.amount); if (!(total > 0)) throw new Error('Enter an amount.');
    if (total > reserves && !await confirmSheet('Above reserves', `${money(total)} is more than the estimated reserves of ${money(reserves)}. Post anyway?`, 'Post anyway', true)) return;
    let left = total; const lines = [{ account: '3200', debit: E.L(total), credit: 0, description: 'Interim dividend' }];
    dirs.forEach((d, i) => { const share = i === dirs.length - 1 ? left : Math.round(total * d.share / 100); left -= share; lines.push({ account: d.dla, debit: 0, credit: E.L(share), description: `Dividend — ${d.name} ${d.share}%` }); });
    await persist('txns', { id: uid(), type: 'journal', date: f.date, ref: 'DIV-' + f.date, description: 'Interim dividend declared', status: 'approved', lines }, 'Dividend posted'); closeSheet(); render();
  });
};

  const f = (S.vatReturns || []).find(x => x.from === p.from && x.status === 'filed'); const B = f ? f.boxes : r.boxes;
  const labels = ['VAT due on sales and other outputs', 'VAT due on acquisitions from the EU', 'Total VAT due', 'VAT reclaimed on purchases and other inputs', 'Net VAT to pay or reclaim', 'Total value of sales excluding VAT', 'Total value of purchases excluding VAT', 'Total value of supplies to the EU', 'Total value of acquisitions from the EU'];
  const csv = toCSV([{ h: 'vrn', v: () => S.company.vatNumber || '' }, { h: 'period_from', v: () => p.from }, { h: 'period_to', v: () => p.to }, { h: 'box', v: 'n' }, { h: 'description', v: 'l' }, { h: 'value', v: r2 => r2.n >= 6 ? String(Math.trunc(r2.v / 100)) : dec(r2.v) }], labels.map((l, i) => ({ n: i + 1, l, v: B[i + 1] })));
  await saveFile(`vat-return-${p.from}-to-${p.to}.csv`, csv, 'text/csv');
};
ACT.fileVat = (el) => {
  const p = vatPeriodByKey(el.dataset.key); const r = E.vatReturn(S, p); const B = r.boxes;
  const sh = openSheet({ title: `File VAT ${fdate(p.from)} – ${fdate(p.to)}`, size: 'narrow', body: `<dl class="kv"><dt>Box 1</dt><dd>${money(B[1])}</dd><dt>Box 4</dt><dd>${money(B[4])}</dd><dt>Box 5</dt><dd><strong>${money(B[5])}</strong></dd><dt>Box 6</dt><dd>${money0(B[6])}</dd><dt>Box 7</dt><dd>${money0(B[7])}</dd></dl>
    ${field('HMRC submission receipt or reference', inp('receipt', '', 'text', 'placeholder="From your MTD software"'))}
    ${callout('', `Marking filed stores these figures, posts a journal clearing 2200 and 2201 to 2202 VAT control, and locks every date up to ${fdate(p.to)}.`)}`,
    foot: `<button class="btn" data-c="x">Cancel</button><button class="btn primary" data-c="ok">Mark as filed</button>` });
  sh.querySelector('[data-c="x"]').onclick = closeSheet;
  sh.querySelector('[data-c="ok"]').onclick = () => run(async () => {
    const f = readForm(sh);
    const lines = [{ account: '2200', debit: E.L(B[1]), credit: 0, description: 'Box 1 output VAT' }, { account: '2201', debit: 0, credit: E.L(B[4]), description: 'Box 4 input VAT' }];
    lines.push(B[5] >= 0 ? { account: '2202', debit: 0, credit: E.L(B[5]), description: 'Box 5 due to HMRC' } : { account: '2202', debit: E.L(-B[5]), credit: 0, description: 'Box 5 repayable by HMRC' });
    const j = { id: uid(), type: 'journal', date: p.to, ref: 'VAT-' + p.to.slice(0, 7), description: `VAT return ${fdate(p.from)} – ${fdate(p.to)}`, status: 'approved', lines: lines.filter(l => E.P(l.debit) || E.P(l.credit)) };
    if (j.lines.length >= 2) await persist('txns', j);
    await store.save('vatReturns', { id: uid(), from: p.from, to: p.to, boxes: B, status: 'filed', filedAt: nowIso(), filedBy: store.user.name || store.user.email, receipt: f.receipt || '', journalId: j.id });
    const c = Object.assign({}, S.company); if (!c.lockDate || c.lockDate < p.to) c.lockDate = p.to; await saveCompany(c);
    closeSheet(); toast('Return filed and period locked'); render();
  });
};

ACT.saveCompanyForm = async () => {
  const f = readForm($('#co-form')); const c = Object.assign({}, S.company, f, { nextInvoiceNo: +f.nextInvoiceNo || 1, paymentTerms: +f.paymentTerms || 30, associatedCompanies: +f.associatedCompanies || 0 });
  if (!/^\d{2}-\d{2}$/.test(c.yearEnd)) throw new Error('Write the year end as MM-DD, for example 03-31.');
  const dirs = (c.directors || []).map(d => Object.assign({}, d)); $$('[data-d]').forEach(el => { const d = dirs[+el.dataset.i]; d[el.dataset.d] = el.dataset.d === 'share' ? +el.value : el.value; });
  if (dirs.length && dirs.reduce((s, d) => s + d.share, 0) !== 100) throw new Error('Shareholdings must add up to 100%.');
  c.directors = dirs; await saveCompany(c, 'Company details saved'); UI.period = null; render();
};
ACT.saveVatForm = async () => {
  const f = readForm($('#vat-form')); const c = Object.assign({}, S.company, f, { vatStagger: +f.vatStagger, flatRate: +f.flatRate });
  if (c.vatRegistered && (!c.vatNumber || !c.vatRegDate)) throw new Error('Enter the VAT number and the effective date of registration.');
  await saveCompany(c, 'VAT settings saved'); render();
};
ACT.saveLock = async () => {
  const v = $('#f-lockDate').value; const c = Object.assign({}, S.company, { lockDate: v || null });
  if (S.company.lockDate && (!v || v < S.company.lockDate) && !await confirmSheet('Unlock a period', `Moving the lock date back from ${fdate(S.company.lockDate)} reopens filed periods to change. Continue?`, 'Unlock', true)) return;
  await saveCompany(c, v ? `Locked to ${fdate(v)}` : 'Lock removed'); render();
};
ACT.editAccount = (el) => {
  const ex = (S.accounts || []).find(a => a.code === el.dataset.id);
  const a = ex ? clone(ex) : { code: '', name: '', type: 'overhead', vatDefault: 'S20', archived: false };
  const system = ex && E.DEFAULT_ACCOUNTS.some(d => d.code === a.code); const used = ex && E.ledger(S, { account: a.code }).length;
  const ro = !can.edit();
  const sh = openSheet({ title: ex ? `${a.code} · ${a.name}` : 'Add account', size: 'narrow', body: `<div class="grid cols-2">
    ${field('Code', inp('code', a.code, 'text', ex || ro ? 'readonly' : 'placeholder="4 digits"'))}${field('Type', sel('type', [['income', 'Income'], ['cos', 'Cost of sales'], ['overhead', 'Overhead'], ['fixed', 'Fixed asset'], ['current_asset', 'Current asset'], ['bank', 'Bank'], ['current_liability', 'Liability'], ['equity', 'Equity']].map(([k, l]) => `<option value="${k}"${a.type === k ? ' selected' : ''}>${l}</option>`).join(''), system || used || ro ? 'disabled' : ''))}
    ${field('Name', inp('name', a.name, 'text', ro ? 'readonly' : ''), 2)}${field('Default VAT code', sel('vatDefault', vatOptions(a.vatDefault), ro ? 'disabled' : ''), 2)}
    <div class="field">${chk('archived', a.archived, 'Archived (hidden from pickers)')}</div></div>${system ? callout('', 'A standard account: its type is fixed so the reports stay correct.') : ''}`,

};
ACT.editRule = (el) => {
  const ex = (S.rules || []).find(r => r.id === el.dataset.id);

ACT.editUser = (el) => {
  const ex = (S.users || []).find(u => u.email === el.dataset.id); const u = ex ? clone(ex) : { email: '', name: '', role: 'accountant' };

    foot: `${ex && ex.email !== store.user.email ? '<button class="btn danger" data-c="del">Remove access</button>' : ''}<button class="btn primary" data-c="save">Save</button>` });
  sh.querySelector('[data-c="save"]').onclick = () => run(async () => { const f = readForm(sh); f.email = (f.email || '').trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(f.email)) throw new Error('Enter a valid email.'); Object.assign(u, f); await persist('users', u, 'Access saved'); closeSheet(); render(); });
  const del = sh.querySelector('[data-c="del"]'); if (del) del.onclick = () => run(async () => { if (!await confirmSheet('Remove access', `Stop ${esc(u.email)} signing in?`, 'Remove', true)) return; await removeRec('users', u.email, 'Access removed'); closeSheet(); render(); });
};

// ---------- boot ----------
function loginScreen(msg) {
  $('#root').innerHTML = `<div class="login"><form class="login-card" id="login">
    <div class="brand" style="padding:0"><div class="brand-mark">D</div><div><div class="brand-name">Digby's &amp; Co</div><div class="brand-sub">Accounts</div></div></div>
    <h1>Sign in</h1>${msg ? callout('bad', esc(msg)) : ''}
    ${field('Email', '<input class="input" id="lg-email" type="email" autocomplete="username" required>')}
    ${field('Password', '<input class="input" id="lg-pass" type="password" autocomplete="current-password">')}
    <button class="btn primary" type="submit" style="height:40px">Sign in</button>
    <button class="btn plain" type="button" id="lg-link">Email me a sign-in link instead</button>
    <p class="faint" style="margin:0;font-size:12.5px">Only people the owner has given access can sign in.</p></form></div>`;
  $('#login').addEventListener('submit', (e) => { e.preventDefault(); run(async () => { await store.signIn($('#lg-email').value.trim(), $('#lg-pass').value); await start(); }); });
  $('#lg-link').addEventListener('click', () => run(async () => { const em = $('#lg-email').value.trim(); if (!em) throw new Error('Enter your email first.'); await store.sendLink(em); toast('Check your email for the sign-in link'); }));
}
async function start() {
  $('#root').innerHTML = `<div class="login"><div class="muted">Loading the books…</div></div>`;
  try {
    const ok = await store.init();
    if (!ok) return loginScreen();
    S = await store.load();
    S.company = S.company || {};
    if (!S.company.name) S.company = Object.assign({ name: "Digby's & Co Limited", tradingName: "Digby's", yearEnd: '03-31', invoicePrefix: 'INV-', nextInvoiceNo: 188, paymentTerms: 30, directors: [{ name: 'James Brierley', share: 70, dla: '2300' }, { name: 'Mike Jeffries', share: 30, dla: '2301' }], vatRegistered: false, registeredIn: 'England and Wales' }, S.company);
    const hash = (location.hash || '').replace('#', ''); if (hash && PAGES[hash]) UI.page = hash;
    render();
    if (store.mode === 'live') ACT.syncBank().catch(e => toast(e.message, true));
  } catch (e) { console.error(e); if (store.mode === 'live') loginScreen(e.message); else $('#root').innerHTML = `<div class="login"><div class="login-card"><h1>Could not load</h1><p>${esc(e.message)}</p></div></div>`; }
}
window.addEventListener('DOMContentLoaded', () => {
  store = MODE === 'demo' ? window.Stores.DemoStore() : window.Stores.LiveStore(LIVE_CONFIG);
  start();
});
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (h && PAGES[h] && h !== UI.page) go(h); });
